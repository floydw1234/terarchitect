# Sample ticket specs for dogfood benchmarks on the Terarchitect repo itself.
# Replace terarchitect.* UUIDs with your spark project before a live terarchitect run.

tickets:
  - id: agents-bench-pointer
    title: Point agents at scripts/bench from AGENTS.md
    prompt: |
      Add one sentence to AGENTS.md under verification guidance linking to scripts/bench/README.md for
      local comparison harness usage (dry-run and baseline mode). No other doc churn. Run `make ci-python`.
    terarchitect:
      project_id: ""
      ticket_id: ""
      attempt_id: ""

  - id: worker-inactivity-env-doc
    title: Document worker inactivity watchdog env
    prompt: |
      Document WORKER_INACTIVITY_TIMEOUT_SEC in docs/PHASE1_WORKER_API.md: default 600 seconds, 0 disables
      the OpenCode inactivity watchdog that fails stalled worker turns. One short subsection only.
      Run `make ci-python`. No Docker.
    terarchitect:
      project_id: ""
      ticket_id: ""
      attempt_id: ""

  - id: auto-ship-runtime-readiness
    title: Surface auto-ship runtime issues in project status
    prompt: |
      When a project has auto_ship enabled, execution_readiness issues should mention missing in-compose
      AGENTHUB_URL/AGENTHUB_API_KEY or TERARCHITECT_WORKER_API_KEY needed for in-backend auto-ship.
      If this is already implemented, add a focused unit test in backend/tests asserting the issue strings;
      otherwise implement in backend/utils/auto_ship_runtime.py and project status. Run `make ci-python`.
    terarchitect:
      project_id: ""
      ticket_id: ""
      attempt_id: ""

  - id: bench-harness-token-json
    title: Parse JSON token usage in bench harness
    prompt: |
      Extend scripts/bench/harness.py parse_token_usage to recognize JSON fields input_tokens and
      output_tokens from agent CLI output. Add a unit test in tests/test_bench_harness.py. Run `make ci-python`.
    terarchitect:
      project_id: ""
      ticket_id: ""
      attempt_id: ""

  - id: roadmap-protected-path-stub
    title: Stub protected-path gate in ROADMAP gaps
    prompt: |
      In plans/ROADMAP.md section 3 (Gaps), add one bullet describing the planned minimal protected-path
      glob gate before ship (no implementation). Cross-link docs/RUNBOOK.md protected areas if mentioned there,
      or note TBD. Run `make ci-python`.
    terarchitect:
      project_id: ""
      ticket_id: ""
      attempt_id: ""
