[pytest]
testpaths = tests agent/tests
pythonpath = .
addopts = -v --tb=short
markers =
    smoke: API-level smoke tests (no agent, no LLM)
    integration: Full-stack integration tests
    swarm: Swarm-mode integration tests (stub agenthub)
    swarm_real: Swarm-mode integration tests with real agenthub binary (requires go on PATH)
    swarm_docker: Swarm-mode integration tests with the prod terarchitect-agenthub Docker image
