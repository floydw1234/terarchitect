services:
  # Agent image (build only). Run the coordinator on the host; it starts agent containers with docker run.
  # Build with: docker compose build agent
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: terarchitect-agent
    profiles:
      - build-agent

  # Flask API + DB (no in-process agent; enqueues jobs only)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: terarchitect-backend
    ports:
      - "5010:5010"
    env_file:
      - ./backend/.env
    environment:
      # Bridge network: reach postgres by service name on its internal port
      DATABASE_URL: postgresql://terarchitect:terarchitect@postgres:5432/terarchitect
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MEMORY_SAVE_DIR: /tmp/terarchitect
      # CORS: allow the frontend (port 3000) from any hostname.
      # This covers localhost, LAN IPs, SSH port-forwards, etc.
      CORS_ORIGINS: "ANY_PORT_3000"
      # All LLM/embedding/GitHub settings are configured via the Settings UI (stored in DB).
      # See Settings → Director, Worker, Embeddings sections.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: terarchitect-postgres
    environment:
      POSTGRES_USER: terarchitect
      POSTGRES_PASSWORD: terarchitect
      POSTGRES_DB: terarchitect
    volumes:
      # Bind mount for persistence (survives docker-compose down -v)
      - ./data/postgres:/var/lib/postgresql/data
      # Auto-run migrations on first start
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"   # host 5433 to avoid conflict with other postgres on 5432
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terarchitect -d terarchitect"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # AgentHub — swarm mode git DAG + message board (optional, only needed for TERARCHITECT_MODE=swarm)
  agenthub:
    build:
      context: .
      dockerfile: Dockerfile.agenthub
    container_name: terarchitect-agenthub
    environment:
      AGENTHUB_ADMIN_KEY: ${AGENTHUB_ADMIN_KEY:-changeme}
    volumes:
      - ./data/agenthub:/data
    ports:
      - "8088:8080"
    restart: unless-stopped
    profiles:
      - swarm

  # React frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: terarchitect-frontend
    environment:
      # No REACT_APP_API_URL needed — the frontend derives the backend URL from
      # window.location.hostname at runtime, so it works for any access method
      # (local, LAN, SSH port-forward, etc.) without a rebuild.
      # Set REACT_APP_API_URL here only if the backend is on a different host entirely.
      - REACT_APP_API_URL=
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    restart: unless-stopped

networks:
  default:
    name: terarchitect_default