services:
  # Agent image (build only). The coordinator service or host coordinator starts worker containers with docker run.
  # Build with: docker compose build agent
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: terarchitect-agent
    profiles:
      - build-agent

  # Coordinator runtime. Starts worker containers onto the compose network; no host repo bind mounts.
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.coordinator
    container_name: terarchitect-coordinator
    environment:
      TERARCHITECT_API_URL: ${TERARCHITECT_API_URL:-http://backend:5010}
      PROJECT_ID: ${PROJECT_ID:-}
      PROJECT_IDS: ${PROJECT_IDS:-}
      TERARCHITECT_WORKER_API_KEY: ${TERARCHITECT_WORKER_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      AGENT_IMAGE: ${AGENT_IMAGE:-terarchitect-agent}
      AGENT_DOCKER_MODE: ${AGENT_DOCKER_MODE:-dind}
      AGENT_CACHE_VOLUME: ${AGENT_CACHE_VOLUME:-terarchitect-agent-cache}
      MAX_CONCURRENT_AGENTS: ${MAX_CONCURRENT_AGENTS:-1}
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-10}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-terarchitect_default}
      AGENTHUB_URL: ${AGENTHUB_URL:-http://agenthub:8080}
      AGENTHUB_API_KEY: ${AGENTHUB_API_KEY:-}
      AGENTHUB_API_KEY_PATH: ${AGENTHUB_API_KEY_PATH:-}
      AGENTHUB_AGENT_ID: ${AGENTHUB_AGENT_ID:-}
      DIRECTOR_PROVIDER: ${DIRECTOR_PROVIDER:-}
      DIRECTOR_LLM_URL: ${DIRECTOR_LLM_URL:-}
      DIRECTOR_MODEL: ${DIRECTOR_MODEL:-}
      DIRECTOR_API_KEY: ${DIRECTOR_API_KEY:-}
      DIRECTOR_API_KEY_PATH: ${DIRECTOR_API_KEY_PATH:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_KEY_PATH: ${OPENROUTER_API_KEY_PATH:-}
      WORKER_MODE: ${WORKER_MODE:-}
      WORKER_LLM_URL: ${WORKER_LLM_URL:-}
      WORKER_MODEL: ${WORKER_MODEL:-}
      WORKER_API_KEY: ${WORKER_API_KEY:-}
      WORKER_API_KEY_PATH: ${WORKER_API_KEY_PATH:-}
      WORKER_TIMEOUT_SEC: ${WORKER_TIMEOUT_SEC:-}
      CODEX_EXTRA_FLAGS: ${CODEX_EXTRA_FLAGS:-}
      CODEX_SANDBOX: ${CODEX_SANDBOX:-}
      CLAUDE_CODE_EXTRA_TOOLS: ${CLAUDE_CODE_EXTRA_TOOLS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_PATH: ${OPENAI_API_KEY_PATH:-}
      openai_api_key: ${openai_api_key:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-}
      MEMORY_EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-}
      MEMORY_LLM_MODEL: ${MEMORY_LLM_MODEL:-}
      MEMORY_LLM_BASE_URL: ${MEMORY_LLM_BASE_URL:-}
      MEMORY_LLM_API_KEY: ${MEMORY_LLM_API_KEY:-}
      MIDDLE_AGENT_DEBUG: ${MIDDLE_AGENT_DEBUG:-}
      OPENCODE_SERVER_URL: ${OPENCODE_SERVER_URL:-}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
    depends_on:
      backend:
        condition: service_started
      agenthub:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coordinator-state:/data/coordinator
    restart: unless-stopped

  # Flask API + DB (no in-process agent; enqueues jobs only)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: terarchitect-backend
    ports:
      - "5010:5010"
    env_file:
      - ./example.env
    environment:
      # Bridge network: reach postgres by service name on its internal port
      DATABASE_URL: postgresql://terarchitect:terarchitect@postgres:5432/terarchitect
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MEMORY_SAVE_DIR: /tmp/terarchitect
      # CORS: allow the frontend (port 3000) from any hostname.
      # This covers localhost, LAN IPs, SSH port-forwards, etc.
      CORS_ORIGINS: "ANY_PORT_3000"
      # All LLM/embedding/GitHub settings are configured via the Settings UI (stored in DB).
      # See Settings → Director, Worker, Embeddings sections.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: terarchitect-postgres
    environment:
      POSTGRES_USER: terarchitect
      POSTGRES_PASSWORD: terarchitect
      POSTGRES_DB: terarchitect
    volumes:
      # Bind mount for persistence (survives docker-compose down -v)
      - ./data/postgres:/var/lib/postgresql/data
      # Auto-run migrations on first start
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"   # host 5433 to avoid conflict with other postgres on 5432
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terarchitect -d terarchitect"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # AgentHub — swarm mode git DAG + message board
  agenthub:
    build:
      context: .
      dockerfile: Dockerfile.agenthub
    container_name: terarchitect-agenthub
    environment:
      AGENTHUB_ADMIN_KEY: ${AGENTHUB_ADMIN_KEY:-changeme}
    volumes:
      - ./data/agenthub:/data
    ports:
      - "8088:8080"
    restart: unless-stopped

  # React frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: terarchitect-frontend
    environment:
      # No REACT_APP_API_URL needed — the frontend derives the backend URL from
      # window.location.hostname at runtime, so it works for any access method
      # (local, LAN, SSH port-forward, etc.) without a rebuild.
      # Set REACT_APP_API_URL here only if the backend is on a different host entirely.
      - REACT_APP_API_URL=
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    restart: unless-stopped

networks:
  default:
    name: terarchitect_default

volumes:
  coordinator-state:
