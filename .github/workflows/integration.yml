name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run unit tests
        run: python -m pytest agent/tests/ -v

  smoke-tests:
    name: Smoke + Swarm Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Ensure backend env file exists
        run: touch backend/.env

      - name: Build and start test backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            --project-name terarchitect-test \
            up -d --build backend postgres
        timeout-minutes: 5

      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5011/health; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 4
          done
          echo "Backend failed to start" && exit 1

      - name: Run smoke tests
        run: python -m pytest tests/integration/test_api_smoke.py -m smoke -v --no-compose

      - name: Run swarm integration tests
        run: python -m pytest tests/integration/test_swarm.py -m swarm -v --no-compose

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            --project-name terarchitect-test \
            down -v
