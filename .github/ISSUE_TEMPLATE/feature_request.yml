name: Feature request
description: Propose an improvement to Terarchitect
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow pain should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend/UI
        - Backend/API
        - Coordinator
        - Agent worker
        - AgentHub
        - Ship Room
        - CLI
        - Deployment/ops
        - Docs
        - Other
  - type: textarea
    id: notes
    attributes:
      label: Additional context
